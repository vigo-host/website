<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;

html,body{

  height:100%;

body{

.bg-video{

.overlay{

.container{

.container.active{

#home .card{

#payment .card{

.title{

.card{
  background:rgba(0,0,0,.65);
  border-radius:24px;
  padding:28px 22px;
  backdrop-filter:blur(8px);
}

.item{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    margin:12px 0;
    padding:16px 18px;
    background:#000;
    border-radius:16px;
    color:#fff;
    text-decoration:none;
    font-size:16px;
    font-weight:600;
}

.item:hover{
  transform:scale(1.02);
}

.item i{
  width:28px;
  font-size:24px;
  text-align:center;
}

.btn{
  width:100%;
  margin-top:16px;
  padding:18px;
  border:none;
  border-radius:18px;
  background:#fff;
  color:#000;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.back{
  display:inline-block;
  margin-bottom:16px;
  padding:10px 18px;
  background:#fff;
  color:#000;
  border-radius:14px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.credit{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  font-size:13px;
  opacity:.8;
}
</style>
</head>
<body>

Terima kasih sudah berkunjung ke website ini.

 <div class="title">Payment</div>

    <div class="item">DANA : 089509082049</div>

  <script>
const audio = document.getElementById("mainSound");
const video = document.getElementById("bgVideo");

// 🔇 VIDEO BACKGROUND PERMANEN BISU
video.muted = true;
video.volume = 0;

let started = false;
let mode = null;

/* PLAYLIST HOME (LINK) */ 
const homeSongs = [
  "https://i.top4top.io/m_38294zyfy1.mp3",
  "https://h.top4top.io/m_38295qhxu1.mp3",
  "https://f.top4top.io/m_3829wqpt81.mp3",
  "https://g.top4top.io/m_3829xgvax1.mp3"
];

let playlist = [];
let index = 0;

/* SHUFFLE AMAN */
function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* STOP TOTAL */
function stopAudio(){
  audio.pause();
  audio.currentTime = 0;
  audio.removeAttribute("src");
  audio.load();
}

/* LOAD HOME SONG */
function loadHome(){
  if(index >= playlist.length){
    playlist = shuffle(homeSongs);
    index = 0;
  }
  audio.src = playlist[index];
  audio.loop = false;
  audio.play().catch(()=>{});
}

/* LOAD PAYMENT SONG (LINK) */
function loadPayment(){
  audio.src = "https://d.top4top.io/m_38290sfwu1.mp3";
  audio.loop = true;
  audio.play().catch(()=>{});
}

/* SATU-SATUNYA ONENDED */
audio.onended = () => {
  if(mode === "home"){
    index++;
    loadHome();
  }
};

/* START */
function startWeb(){
  if(started) return;
  started = true;

  video.play().catch(()=>{});
  openPage("home");
}

/* PAGE SWITCH */
function openPage(id){
  document.querySelectorAll(".container")
    .forEach(c => c.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  if(!started) return;

  stopAudio();

  if(id === "home"){
    mode = "home";
    if(playlist.length === 0){
      playlist = shuffle(homeSongs);
      index = 0;
    }
    loadHome();
  }

  if(id === "payment"){
    mode = "payment";
    loadPayment();
  }
}
      </script>
</body>

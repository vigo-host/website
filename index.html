<!DOCTYPE html>

<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{background:black;color:#fff;}
  .bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);}
  .container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;max-width:340px;padding:0 14px;text-align:center;display:none;z-index:2;}
  .container.active{display:block;}
  .title{font-size:30px;font-weight:700;margin-bottom:16px;}
  .card{padding:26px 18px;background:rgba(0,0,0,.6);border-radius:22px;}
  .item{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:10px 0;padding:14px;background:#000;border-radius:14px;color:#fff;font-size:15px;font-weight:600;text-decoration:none;}
  .item i{font-size:18px;}
  .btn{width:100%;margin-top:14px;padding:14px;border-radius:14px;background:#fff;color:#000;font-weight:600;cursor:pointer;}
  .back{display:inline-block;margin-bottom:14px;padding:8px 14px;background:#fff;color:#000;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;}
  .credit{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.8;}
</style>
</head>
<body>
<video id="bgVideo" class="bg-video" autoplay muted loop playsinline>
  <source src="https://b.top4top.io/m_3635xr57z0.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<audio id="mainSound" preload="auto"></audio>

<!-- INTRO -->
<div class="container active" id="intro">
  <div class="card">
    <div class="title">Selamat Datang 👋</div>
    <p style="font-size:14px;opacity:.9;line-height:1.6;">
      Bu Ani beli kargo<br>
      Kenalin nama aku Vigo<br><br>
      Terima kasih sudah berkunjung ke website ini.
    </p>
    <div class="btn" onclick="startWeb()">Masuk</div>
  </div>
</div>

<!-- HOME -->
<div class="container" id="home">
  <div class="title">Vigo Website</div>
  <div class="card">

    <a class="item" href="https://www.tiktok.com/@.ovidio_guzman" target="_blank">

    </a>

    <a class="item" href="https://www.instagram.com/@ovidio_guzmn" target="_blank">
      <i class="fa-brands fa-instagram"></i> Instagram
    </a>

    <a class="item" href="https://wa.me/6289509082049" target="_blank">
      <i class="fa-brands fa-whatsapp"></i> WhatsApp Utama
    </a>

    <a class="item" href="https://wa.me/6289616200535" target="_blank">
      <i class="fa-brands fa-whatsapp"></i> WhatsApp Cadangan
    </a>

    <div class="btn" onclick="openPage('payment')">Payment</div>
  </div>
       </div>
<!-- PAYMENT -->
<div class="container" id="payment">
 <div class="title">Payment</div>
  <div class="card">
    <div class="back" onclick="openPage('home')">← Back</div>
    <div class="item">DANA : 089509082049</div>
    <div class="item">OVO : 089509082049</div>
    <div class="item">GOPAY : 089509082049</div>
  </div>
</div>

<div class="credit">© Vigo</div>

  <script>
const audio = document.getElementById("mainSound");
const video = document.getElementById("bgVideo");

// 🔇 VIDEO BACKGROUND PERMANEN BISU
video.muted = true;
video.volume = 0;

let started = false;
let mode = null;

/* PLAYLIST HOME (LINK) */ 
const homeSongs = [
  "https://i.top4top.io/m_38294zyfy1.mp3",
  "https://h.top4top.io/m_38295qhxu1.mp3",
  "https://f.top4top.io/m_3829wqpt81.mp3",
  "https://g.top4top.io/m_3829xgvax1.mp3"
];

let playlist = [];
let index = 0;

/* SHUFFLE AMAN */
function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* STOP TOTAL */
function stopAudio(){
  audio.pause();
  audio.currentTime = 0;
  audio.removeAttribute("src");
  audio.load();
}

/* LOAD HOME SONG */
function loadHome(){
  if(index >= playlist.length){
    playlist = shuffle(homeSongs);
    index = 0;
  }
  audio.src = playlist[index];
  audio.loop = false;
  audio.play().catch(()=>{});
}

/* LOAD PAYMENT SONG (LINK) */
function loadPayment(){
  audio.src = "https://i.top4top.io/m_36822torv1.mp3";
  audio.loop = true;
  audio.play().catch(()=>{});
}

/* SATU-SATUNYA ONENDED */
audio.onended = () => {
  if(mode === "home"){
    index++;
    loadHome();
  }
};

/* START */
function startWeb(){
  if(started) return;
  started = true;

  video.play().catch(()=>{});
  openPage("home");
}

/* PAGE SWITCH */
function openPage(id){
  document.querySelectorAll(".container")
    .forEach(c => c.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  if(!started) return;

  stopAudio();

  if(id === "home"){
    mode = "home";
    if(playlist.length === 0){
      playlist = shuffle(homeSongs);
      index = 0;
    }
    loadHome();
  }

  if(id === "payment"){
    mode = "payment";
    loadPayment();
  }
}
      </script>
</body>
</html>

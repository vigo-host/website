<script>
const audio = document.getElementById("mainSound");
const video = document.getElementById("bgVideo");

let started = false;
let mode = "home";
let lastHome = "";

/* PLAYLIST */
const homeList = [
  "home1.mp3",
  "home2.mp3",
  "home3.mp3",
  "home4.mp3",
  "home5.mp3"
];

const paymentSound = "payment.mp3";

/* AMBIL RANDOM (ANTI SAMA) */
function getRandomHome(){
  let song;
  do{
    song = homeList[Math.floor(Math.random()*homeList.length)];
  }while(song === lastHome && homeList.length > 1);
  lastHome = song;
  return song;
}

/* SET AUDIO (WAJIB LOAD) */
function setAudio(src, loop){
  audio.src = src;
  audio.loop = loop;
  audio.load();              // ⬅️ INI KUNCI
  audio.play().catch(()=>{});
}

/* HOME NEXT */
audio.addEventListener("ended", ()=>{
  if(mode === "home"){
    setAudio(getRandomHome(), false);
  }
});

/* START */
function startWeb(){
  if(started) return;

  started = true;

  video.muted = false;
  video.play().catch(()=>{});

  mode = "home";
  setAudio(getRandomHome(), false);
  openPage("home");
}

/* PINDAH PAGE */
function openPage(id){
  document.querySelectorAll(".container")
    .forEach(c=>c.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  if(!started) return;

  if(id === "payment" && mode !== "payment"){
    mode = "payment";
    setAudio(paymentSound, true);
  }

  if(id === "home" && mode !== "home"){
    mode = "home";
    setAudio(getRandomHome(), false);
  }
}
</script>

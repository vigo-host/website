<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Website Vigo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
html,body{width:100%;height:100%;overflow:hidden;}
body{background:black;color:#fff;}

.bg-video{
    position:fixed;inset:0;
    width:100%;height:100%;
    object-fit:cover;z-index:-1;
}
.overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.55);z-index:0;
}
.container{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:100%;
    max-width:340px;
    padding:0 14px;
    text-align:center;
    display:none;
    z-index:2;
    overflow:hidden; /* FIX KOTAK ANEH */
}
.container#intro{max-width:420px;}
.container.active{display:block;}

.title{font-size:30px;font-weight:700;margin-bottom:16px;}
.card{
    padding:26px 18px;
    background:rgba(0,0,0,.6);
    border-radius:22px;
    backdrop-filter: blur(6px);
}
.item{
    width:100%;
    margin:10px 0;
    padding:14px;
    background:#000;
    border-radius:14px;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    font-size:15px;
    font-weight:600;
    text-decoration:none;
}
.btn{
    width:100%;
    margin-top:14px;
    padding:14px;
    border-radius:14px;
    background:#fff;
    color:#000;
    font-weight:600;
    cursor:pointer;
}
.back{text-align:left;margin-bottom:14px;cursor:pointer;}
.intro-text{font-size:16px;line-height:1.8;}
.credit{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    opacity:.8;
    z-index:3;
}
</style>
</head>

<body>

<video id="bgVideo" class="bg-video" autoplay muted loop playsinline>
    <source src="https://b.top4top.io/m_3635xr57z0.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="mainSound"></audio>

<!-- INTRO -->
<div class="container active" id="intro">
    <div class="card">
        <div class="title">Selamat Datang 👋</div>
        <div class="intro-text">
            Bu Ani beli kargo<br>
            Kenalin nama aku Vigo<br><br>
            Terima kasih sudah berkunjung ke website ini.
            <br><br>
            Klik tombol di bawah untuk melanjutkan.
        </div>
        <div class="btn" onclick="startWeb()">Masuk ke Web</div>
    </div>
</div>

<!-- HOME -->
<div class="container" id="home">
    <div class="title">Vigo Website</div>
    <div class="card">
        <a class="item" href="https://www.tiktok.com/@.ovidio_guzman" target="_blank">
            <i class="fa-brands fa-tiktok"></i> TikTok
        </a>
        <a class="item" href="https://wa.me/6289509082049" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> WA Utama
        </a>
        <a class="item" href="https://wa.me/6289616200535" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> WA Cadangan
        </a>
        <div class="btn" onclick="openPage('payment')">Payment</div>
    </div>
</div>

<!-- PAYMENT -->
<div class="container" id="payment">
    <div class="card">
        <div class="back" onclick="openPage('home')">← Back</div>
        <div class="item">DANA : 089509082049</div>
        <div class="item">OVO : 089509082049</div>
        <div class="item">GOPAY : 089509082049</div>
    </div>
</div>

<div class="credit">credit © Vigo</div>

<script>
const audio = document.getElementById("mainSound");
const video = document.getElementById("bgVideo");

let started = false;
let mode = "home";
let lastHomeSong = "";

/* PLAYLIST */
const homeList = [
    "home1.mp3",
    "home2.mp3",
    "home3.mp3",
    "home4.mp3",
    "home5.mp3"
];

const paymentSound = "payment.mp3";

/* RANDOM HOME (ANTI LAGU SAMA) */
function randomHome(){
    let song;
    do{
        song = homeList[Math.floor(Math.random() * homeList.length)];
    }while(song === lastHomeSong && homeList.length > 1);
    lastHomeSong = song;
    return song;
}

/* PLAY SOUND (AMAN ANDROID) */
function playSound(){
    if(mode === "payment"){
        audio.src = paymentSound;
        audio.loop = true;
    }else{
        audio.src = randomHome();
        audio.loop = false;
    }
    audio.play().catch(()=>{});
}

/* HOME HABIS → RANDOM LAGI */
audio.addEventListener("ended", ()=>{
    if(mode === "home"){
        playSound();
    }
});

/* START WEB */
function startWeb(){
    if(started) return;

    video.muted = false;
    video.play().catch(()=>{});

    started = true;
    mode = "home";
    playSound();
    openPage("home");
}

/* PINDAH PAGE */
function openPage(id){
    document.querySelectorAll(".container")
        .forEach(c=>c.classList.remove("active"));
    document.getElementById(id).classList.add("active");

    if(!started) return;

    const newMode = (id === "payment") ? "payment" : "home";
    if(newMode !== mode){
        mode = newMode;
        playSound();
    }
}
</script>

</body>
</html>
